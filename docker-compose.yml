services:
  mongo:
    image: mongo:7.0
    container_name: deprem-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build: .
    container_name: deprem-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/deprem_db
      - SYNC_INTERVAL_MINUTES=2
      - FETCH_COUNT=45
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
